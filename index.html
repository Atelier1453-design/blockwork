 html,body{margin:0;padding:0;background:#EDEAE1;
  font-family:"Hiragino Sans","Hiragino Kaku Gothic ProN","Noto Sans JP",system-ui,sans-serif;}
 #msg{padding:60px 24px;color:#6B655C;font-size:14px;line-height:1.7;}

<body>
<div id="msg">読み込んでいます…</div>
<script>
(function () {
  var KEY = "bw:appcache";
  function boot(html) {
    document.open();
    document.write(html);
    document.close();
  }
  function fallback(note) {
    var cached = null;
    try { cached = localStorage.getItem(KEY); } catch (e) {}
    if (cached) { boot(cached); return; }
    var m = document.getElementById("msg");
    if (m) m.textContent = note;
  }
  var x = new XMLHttpRequest();
  x.open("GET", "app.html?ts=" + Date.now(), true);
  x.setRequestHeader("Cache-Control", "no-cache");
  x.onload = function () {
    var t = x.responseText || "";
    if (x.status >= 200 && x.status < 400 && t.indexOf("id=\"root\"") !== -1) {
      try { localStorage.setItem(KEY, t); } catch (e) {}
      boot(t);
    } else {
      fallback("本体が読み込めませんでした。app.html が同じ場所にあるか確かめてください。");
    }
  };
  x.onerror = function () { fallback("つながりませんでした。通信を確かめて開き直してください。"); };
  x.send();
})();
</script>
