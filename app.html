.wrap{--paper:#EDEAE1;--card:#F8F6F1;--ink:#26231F;--ink2:#6B655C;--rule:#D5CFC2;--azuki:#8A3E4C;--matcha:#5F7048;--alert:#A33A2B;--amber:#B4661F;
 background:var(--paper);color:var(--ink);min-height:100%;
 font-family:"Hiragino Sans","Hiragino Kaku Gothic ProN","Noto Sans JP",system-ui,sans-serif;font-size:15px;line-height:1.6;}
.wrap *{box-sizing:border-box;}
.head{padding:20px 16px 12px;border-bottom:1px solid var(--rule);display:flex;justify-content:space-between;align-items:flex-end;gap:8px;}
.head h1{margin:0;font-family:"Hiragino Mincho ProN","Yu Mincho",serif;font-weight:600;font-size:22px;letter-spacing:.06em;}
.sub{margin:2px 0 0;font-size:12.5px;color:var(--ink2);}
.statusline{font-size:11.5px;color:var(--matcha);white-space:nowrap;text-align:right;display:flex;flex-direction:column;gap:2px;flex:none;}
.statusmsg{height:15px;overflow:hidden;}
.dragitem{transition:transform .12s ease;}
.tabs{display:flex;gap:2px;padding:8px 10px 0;border-bottom:1px solid var(--rule);overflow-x:auto;position:sticky;top:0;z-index:20;background:var(--paper);box-shadow:0 2px 6px rgba(0,0,0,.05);}
.tab{background:none;border:none;border-bottom:2px solid transparent;padding:8px 12px;font-size:14px;color:var(--ink2);cursor:pointer;white-space:nowrap;font-family:inherit;}
.tab.on{color:var(--azuki);border-bottom-color:var(--azuki);font-weight:600;}
.pad{padding:16px;}
.lead{font-size:13px;color:var(--ink2);margin:0 0 14px;max-width:62ch;}
.controls{display:flex;align-items:center;gap:14px;padding:12px 16px;flex-wrap:wrap;}
.controls label{font-size:12.5px;color:var(--ink2);display:flex;gap:6px;align-items:center;}
.dateinput,.timeinput{font-family:inherit;font-size:14px;padding:5px 8px;border:1px solid var(--rule);background:#fff;border-radius:3px;color:var(--ink);}
.seg{display:flex;border:1px solid var(--rule);border-radius:3px;overflow:hidden;}
.segbtn{background:var(--card);border:none;padding:6px 12px;font-size:13px;cursor:pointer;color:var(--ink2);font-family:inherit;}
.segbtn.on{background:var(--azuki);color:#fff;}
.warn{margin:0 16px 12px;padding:10px 12px;background:#F6E6E2;border-left:3px solid var(--alert);font-size:13px;}
.days{padding:0 12px 40px;}
.day{background:var(--card);border:1px solid var(--rule);border-radius:4px;margin-bottom:8px;overflow:hidden;}
.day.closed{background:transparent;border-style:dashed;opacity:.65;}
.dayhead{display:block;}
.daylabel{font-family:"Hiragino Mincho ProN","Yu Mincho",serif;font-size:16px;letter-spacing:.04em;flex:none;}
.daysum{font-size:12px;color:var(--ink2);display:flex;gap:8px;align-items:center;flex-wrap:wrap;justify-content:flex-end;}
.mini{font-size:11.5px;}
.rest{font-size:12.5px;color:var(--matcha);}
.pill{padding:1px 6px;border-radius:2px;font-size:11px;color:#fff;}
.pill.red{background:var(--alert);} .pill.amber{background:var(--amber);}
.bars{padding:0 12px 10px;display:flex;flex-direction:column;gap:7px;}
.barrow{display:flex;align-items:center;gap:8px;}
.barname{font-size:11.5px;color:var(--ink2);width:56px;flex:none;}
.barnum{font-size:11px;color:var(--ink2);flex:none;width:46px;text-align:right;}
.blkrow{display:flex;gap:1.5px;flex-wrap:wrap;flex:1;align-items:center;}
.blk{width:8px;height:14px;border:1px solid var(--rule);border-radius:1px;}
.blk.ovr{border-color:var(--alert);}
.ovrtag{font-size:10.5px;color:var(--alert);margin-left:6px;}
.reminders{margin:0;padding:0 12px 10px 30px;font-size:12.5px;color:var(--amber);}
.detail{border-top:1px solid var(--rule);padding:10px 12px 14px;}
.lane{margin:0 0 22px;padding:2px 0 2px 10px;border-left:4px solid var(--rule);}
.lane h4{margin:2px 0 6px;display:flex;gap:9px;align-items:center;flex-wrap:wrap;}
.lanename{font-size:14px;font-weight:600;color:#fff;padding:2px 10px;border-radius:3px;letter-spacing:.04em;}
.lanemeta{font-size:11.5px;color:var(--ink2);font-weight:400;}
.redb{color:var(--alert);}
.rowmore{font-family:inherit;font-size:12px;padding:5px 10px;border:1px solid var(--rule);background:#fff;color:var(--ink2);border-radius:3px;cursor:pointer;flex:none;min-height:30px;}
.tline.sel>.trow{background:var(--paper);}
.rowpanel{background:var(--paper);border:1px solid var(--rule);border-radius:3px;padding:9px 10px;margin:2px 0 8px;}
.prow{display:flex;gap:5px;align-items:center;flex-wrap:wrap;margin-bottom:6px;}
.prow:last-child{margin-bottom:0;}
.plabel{font-size:11px;color:var(--ink2);width:104px;flex:none;}
.movedtag.mn{background:var(--ink2);}
.timeline{list-style:none;margin:0;padding:0;}
.timeline{list-style:none;margin:0;padding:0;}
.timeline>li{display:flex;gap:7px;align-items:center;padding:5px 0;border-bottom:1px dotted var(--rule);flex-wrap:wrap;min-width:0;}
.tline{display:block;font-size:13px;padding:0;border-bottom:1px dotted var(--rule);min-width:0;}
.trow{display:flex;gap:7px;align-items:center;padding:5px 0;min-width:0;flex-wrap:wrap;}
